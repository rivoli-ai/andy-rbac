services:
  postgres:
    image: postgres:16-alpine
    container_name: andy-rbac-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: andy_rbac
    ports:
      - "7433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/Andy.Rbac.Api/Dockerfile
      additional_contexts:
        certs: ./certs
    container_name: andy-rbac-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=https://+:8443;http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=andy_rbac;Username=postgres;Password=postgres
      - Auth__Authority=https://host.docker.internal:5001
      - Auth__Audience=andy-rbac
      - Cors__Origins__0=https://localhost:5180
      - Cors__Origins__1=http://localhost:5180
      - Cors__Origins__2=https://localhost:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "7003:8443"
      - "7004:8080"
    volumes:
      - ./certs:/usr/local/share/ca-certificates/custom:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fk", "https://localhost:8443/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: src/Andy.Rbac.Web/Dockerfile
      additional_contexts:
        certs: ./certs
    container_name: andy-rbac-web
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=https://+:8443;http://+:8080
      - Rbac__ApplicationCode=andy-rbac
      - Rbac__ApiBaseUrl=https://api:8443
      - AndyAuth__Authority=https://host.docker.internal:5001
      - AndyAuth__ClientId=andy-rbac-web
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5180:8443"
      - "5181:8080"
    volumes:
      - ./certs:/usr/local/share/ca-certificates/custom:ro
    depends_on:
      - api

volumes:
  postgres_data:
