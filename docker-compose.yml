services:
  postgres:
    image: postgres:16-alpine
    container_name: andy-rbac-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: andy_rbac
    ports:
      - "7433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/Andy.Rbac.Api/Dockerfile
      additional_contexts:
        certs: ./certs
    container_name: andy-rbac-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=https://+:8443;http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=andy_rbac;Username=postgres;Password=postgres
      - Auth__Authority=${ANDY_AUTH_AUTHORITY:-https://host.docker.internal:7001}
      - Auth__Audience=${ANDY_AUTH_AUDIENCE:-urn:andy-rbac-api}
      - AndyAuth__Authority=${ANDY_AUTH_AUTHORITY:-https://host.docker.internal:7001}
      - AndyAuth__DbConnectionString=${ANDY_AUTH_DB_CONNECTION:-Host=host.docker.internal;Port=7435;Database=andy_auth_dev;Username=postgres;Password=postgres}
      - Mcp__ServerUrl=${ANDY_RBAC_API_BASE_URL:-https://host.docker.internal:7003}
      - Cors__Origins__0=https://localhost:5180
      - Cors__Origins__1=http://localhost:5180
      - Cors__Origins__2=https://localhost:3000
      # Registration manifests — seed RBAC applications, resource types, roles
      # from each sibling service's config/registration.json at startup.
      - REGISTRATIONS__MANIFEST_PATHS=/monorepo/andy-auth/config/registration.json:/monorepo/andy-rbac/config/registration.json:/monorepo/andy-containers/config/registration.json:/monorepo/andy-docs/config/registration.json:/monorepo/andy-code-index/config/registration.json:/monorepo/andy-issues/config/registration.json:/monorepo/andy-agents/config/registration.json:/monorepo/andy-tasks/config/registration.json:/monorepo/andy-policies/config/registration.json:/monorepo/andy-models/config/registration.json:/monorepo/andy-mcp-proxy/config/registration.json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "7003:8443"
      - "7004:8080"
    volumes:
      - ./certs:/usr/local/share/ca-certificates/custom:ro
      - ..:/monorepo:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fk", "https://localhost:8443/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: src/Andy.Rbac.Web/Dockerfile
      additional_contexts:
        certs: ./certs
    container_name: andy-rbac-web
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=https://+:8443;http://+:8080
      - Rbac__ApplicationCode=${ANDY_RBAC_APPLICATION_CODE:-andy-rbac}
      # Internal compose network URL — not a cross-repo URL.
      # The web container reaches the api container via the docker-network DNS name.
      - Rbac__ApiBaseUrl=${RBAC_INTERNAL_URL:-https://api:8443}
      - AndyAuth__Authority=${ANDY_AUTH_AUTHORITY:-https://host.docker.internal:7001}
      - AndyAuth__ClientId=${ANDY_FRONTEND_AUTH_CLIENT_ID:-andy-rbac-web}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5180:8443"
      - "5181:8080"
    volumes:
      - ./certs:/usr/local/share/ca-certificates/custom:ro
    depends_on:
      - api

volumes:
  postgres_data:
